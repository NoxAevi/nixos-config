"$schema" = 'https://starship.rs/config-schema.json'
# useful characters  

format = """
$username\
[ ](red)\
$directory\
$git_branch\
$git_status\
$time\
$line_break\
$character
"""

[username]
disabled = false
show_always = true
style_user = "bg:red"
format = '[$user]($style)'

[time]
disabled = false
time_format = "%R"
format = '[$time]($style)'

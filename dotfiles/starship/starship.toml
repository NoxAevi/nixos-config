"$schema" = 'https://starship.rs/config-schema.json'
# useful characters  

format = """
[ ](fg:#1e286d)\
$os\
$username\
[](fg:#1e286d bg:#1b4497)\
$directory\
[](fg:#1b4497 bg:#227dad)\
$git_branch\
$git_status\
[](fg:#227dad bg:#25a1c6)\
$time\
[](fg:#25a1c6)\
$line_break\
$character
"""

# COLORS
# 1. 32c6d4
# 2. 25a1c6
# 3. 227dad
# 4. 1b4497
# 5. 1e296d
# 6. 241853
# 7. 2c173e
# 8. 241026

[os]
disabled = false
style = 'bg:#1e286d'

[username]
disabled = false
show_always = true
format = '[$user ]($style)'
style_user = 'bg:#1e286d'

[directory]
disabled = false
truncation_length = 3
truncation_symbol = "../"
read_only = " 󰌾"
format = "[ $path ]($style)"
style = 'bg:#1b4497'

[git_branch]
symbol = " "
format = '[ $symbol$branch(:$remote_branch) ]($style)'
style = 'bg:#227dad'

[git_status]
format = '[$all_status$ahead_behind ]($style)'
style = 'bg:#227dad'

[time]
disabled = false
time_format = "%R"
format = '[  $time ]($style)'
style = 'bg:#25a1c6'





